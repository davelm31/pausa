<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pausa · Espacios de estudio cerca de tu universidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Pausa · sistema visual =====
   Idea: cuaderno cuadriculado de ingeniería + ficha de préstamo de biblioteca.
   Papel celeste muy claro con cuadrícula, tinta negra y celeste para lo seleccionado. */
:root{
  --paper:#F3F9FD; --grid:#DDEEF8; --card:#FFFFFF; --chip:#EAF5FB;
  --ink:#0B0B0C; --ink-2:#2E343B; --muted:#58646F;
  --primary:#0B0B0C; --on-primary:#FFFFFF;
  --sky:#6FC8F2; --accent-ink:#0B6A9E;
  --mark:#6FC8F2; --mark-soft:#DDF2FC; --on-mark:#0B0B0C;
  --green:#0B6A9E; --green-soft:#E1F3FC; --red:#B3261E; --red-soft:#FBE3E1;
  --line:#CBE0EC; --rule:#BDE0F3; --margin:#8FD3F5; --stamp:#0B6A9E;
  --m-land:#EEF5F8; --m-sea:#BFE4F5; --m-park:#DCEFE3; --m-st:#FFFFFF; --m-st2:#F6FAFC;
  color-scheme:light;
  --serif:'Literata','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* ===== Estructura ===== */
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 16px 130px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media (min-width:520px){ .app{background:var(--paper);background-image:inherit;box-shadow:0 0 0 1px var(--line)} }
header.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;color:var(--ink);
  font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.015em}
.brand svg{width:32px;height:32px;display:block}
.campus{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
main:focus,main:focus-visible{outline:0}
.screen{animation:in .16s ease-out}
@keyframes in{from{opacity:.3}to{opacity:1}}

h1.display{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.14;letter-spacing:-.018em;margin:14px 0 8px;text-wrap:balance}
h1.title{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:6px 0 6px;text-wrap:balance}
h2.sec{font-family:var(--serif);font-weight:600;font-size:19px;margin:24px 0 10px;letter-spacing:-.01em}
h3{margin:0}
.lede{color:var(--ink-2);font-size:15.5px;line-height:1.55;margin:0 0 16px;max-width:44ch}
.small{font-size:13px;color:var(--muted)}
.cap{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin:7px 2px 12px}
.row{display:flex;align-items:center;gap:8px}
.sp{height:12px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:5px}

/* ===== Controles ===== */
.seg{display:flex;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.seg button{flex:1;display:inline-flex;gap:6px;align-items:center;justify-content:center;border:0;background:none;
  padding:9px 8px;border-radius:7px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg.mark button[aria-pressed="true"]{background:var(--mark);color:var(--on-mark);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg.sm button{padding:9px 2px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);
  border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--ink);color:var(--on-mark)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--chip);color:var(--ink-2)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--ink);color:#fff}
.tag.pend{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tag.off{background:#E8EEF2;color:#46515B}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:0;border-radius:10px;
  padding:12px 16px;font-weight:700;font-size:15.5px;margin-top:12px;text-decoration:none}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.mark{background:var(--mark);color:var(--on-mark);box-shadow:0 2px 0 var(--ink)}
.btn.line{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn.sm{min-height:40px;font-size:14px;padding:8px 12px;margin-top:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{margin-top:12px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent-ink);font-weight:700;padding:8px 0;min-height:40px}

.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);
  border-radius:8px;padding:11px 12px;font-size:16px;min-height:46px}
textarea{min-height:76px;resize:vertical}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.stepper button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;font-size:18px;color:var(--accent-ink)}
.stepper button[disabled]{opacity:.35}
.stepper output{min-width:42px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);
  border-radius:10px;padding:12px;margin-bottom:8px}
.opt .oi{width:40px;height:40px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:20px;flex:none}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.opt .pr{margin-left:auto;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.opt .pr small{font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--mark-soft);box-shadow:0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .oi{background:var(--mark);color:var(--on-mark)}

.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 0 8px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.slot small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:1px}
.slot[aria-pressed="true"]{background:var(--mark);border-color:var(--ink);color:var(--on-mark)}
.slot[aria-pressed="true"] small{color:var(--on-mark)}
.slot[disabled]{background:transparent;color:var(--muted);cursor:not-allowed}
.slot[disabled] b{text-decoration:line-through}
.slot.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px}
.slot.wide small{margin:0}

/* ===== Tarjetas de espacio (fichas de catálogo) ===== */
.cards{display:flex;flex-direction:column;gap:10px}
.scard{display:block;width:100%;text-align:left;position:relative;background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--green);border-radius:6px;padding:13px 14px 12px;box-shadow:0 1px 0 var(--line)}
.scard.low{border-left-color:var(--ink)}
.scard.off{border-left-color:#B7C5CF}
.scard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.scard h3{font-family:var(--serif);font-weight:600;font-size:18.5px;line-height:1.2;letter-spacing:-.01em}
.scard .meta{margin-top:6px}
.scard .go{position:absolute;right:10px;top:50%;color:var(--muted);display:none}
.scard .modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.amrow{display:flex;gap:11px;margin-top:9px;color:var(--ink-2);font-size:17px}
.scard .btn{margin-top:10px}

.map{position:relative;z-index:0;height:340px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--m-land)}
.map.small{height:230px}
.map-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:10px 2px 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .g{background:var(--sky);box-shadow:0 0 0 1px var(--ink-2)} .legend .y{background:var(--ink)} .legend .n{background:#C9D3DB;box-shadow:0 0 0 1px var(--ink-2)}
.leaflet-container{font-family:var(--sans);background:var(--m-land)}
.pin{position:relative;min-width:34px;height:30px;padding:0 8px;border-radius:8px;display:grid;place-items:center;
  font:800 14px var(--sans);color:#fff;background:var(--pc,var(--sky));border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--pc,var(--sky));border-bottom:0}
.pin.ok{--pc:#6FC8F2;color:#0B0B0C} .pin.low{--pc:#0B0B0C;color:#fff} .pin.off{--pc:#C9D3DB;color:#0B0B0C}
.pin.sel{transform:scale(1.22);transform-origin:50% 100%;box-shadow:0 0 0 3px #0B0B0C,0 4px 10px rgba(0,0,0,.35)}
.pin.pick{--pc:#0B6A9E;color:#fff;width:34px;padding:0;font-size:18px}
.utec{display:flex;align-items:center;gap:5px;pointer-events:none}
.utec i{width:20px;height:20px;border-radius:50%;background:#0B0B0C;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);flex:none}
.utec b{display:inline-flex;align-items:center;gap:4px;background:#0B0B0C;color:#fff;border-radius:6px;padding:3px 7px;font:800 12px var(--sans);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.svgmap{display:block;width:100%;height:100%}
.svgmap .m-land{fill:var(--m-land)} .svgmap .m-sea{fill:var(--m-sea)} .svgmap .m-park{fill:var(--m-park)}
.svgmap .m-st{stroke:var(--m-st);fill:none;stroke-linecap:round} .svgmap .m-st2{stroke:var(--m-st2);fill:none}
.svgmap .m-hw{stroke:#F0CDB0;fill:none;stroke-linecap:round}
.svgmap .m-ring{fill:none;stroke:var(--accent-ink);stroke-dasharray:3 5;opacity:.55}
.svgmap text{font-family:var(--sans);fill:var(--muted)}
.svgpin{cursor:pointer}
.svgpin .bd{fill:var(--pc);stroke:#fff;stroke-width:2}
.svgpin text{fill:#0B0B0C;font-weight:800;font-size:13px;text-anchor:middle}
.svgpin.ok{--pc:#6FC8F2} .svgpin.low{--pc:#0B0B0C} .svgpin.low text{fill:#fff} .svgpin.off{--pc:#C9D3DB} .svgpin.sel .bd{stroke:#0B0B0C;stroke-width:3.5}

/* ===== Detalle de espacio y zonas ===== */
.zone{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.zone .zh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zone h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:8px 0 4px}
.zone .ideal{margin:0 0 10px;color:var(--ink-2);font-size:14.5px}
.amlist{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.amlist li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.3}
.amlist li .ic{margin-top:1px;color:var(--accent-ink)}
.amlist small{display:block;color:var(--muted);font-size:12px}
.noise{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:3px}
.dots i.on{background:var(--accent-ink)}
.priceline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.rules{list-style:none;margin:0;padding:0}
.rules li{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.rules li .ic{color:var(--accent-ink);margin-top:2px}
.note{font-size:12.5px;color:var(--muted);margin:22px 0 4px}
.banner{display:flex;gap:12px;align-items:center;background:var(--mark-soft);border:1.5px solid var(--ink);border-radius:8px;padding:11px 12px;margin:6px 0 6px;width:100%;text-align:left}
.banner .ic{font-size:22px;flex:none}
.banner b{display:block;font-size:14.5px}
.banner span{font-size:13px;color:var(--ink-2)}
.empty{text-align:center;color:var(--ink-2);background:var(--card);border:1.5px dashed var(--line);border-radius:8px;padding:30px 16px;margin-top:10px}
.empty .ic{font-size:30px;color:var(--muted)}
.empty p{margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 10px}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* ===== Ficha de reserva (préstamo de biblioteca) ===== */
.ficha{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 14px 14px 36px;margin-bottom:14px;box-shadow:0 1px 0 var(--line),0 4px 0 -1px var(--card),0 5px 0 -1px var(--line)}
.ficha::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.ficha::after{content:"";position:absolute;left:6px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.ficha .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
.ficha .sig{font-weight:800;color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.ficha h3{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;margin:6px 0 2px}
.fr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.fr span:first-child{color:var(--muted)}
.fr span:last-child{font-weight:700;text-align:right}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stampbox{min-height:84px;border:1.5px dashed var(--rule);border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px}
.stampbox .t{font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start}
.stampbox .blank{width:100%;border-bottom:1.5px solid var(--rule);height:28px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;border:2.5px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:4px 10px;
  font:800 15px var(--serif);letter-spacing:.07em;text-transform:uppercase;transform:rotate(-5deg);opacity:.94}
.stamp.out{transform:rotate(4deg)}
.stamp small{font:700 17px var(--sans);letter-spacing:.02em;text-transform:none;font-variant-numeric:tabular-nums}
.stamp.new{animation:stamp .55s cubic-bezier(.2,1.5,.35,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-5deg);opacity:.94}}
.stamp.out.new{animation-name:stampout}
@keyframes stampout{0%{transform:scale(2.4) rotate(12deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(4deg);opacity:.94}}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800}
.status.confirmed{color:var(--accent-ink)} .status.active{color:var(--green)} .status.done{color:var(--muted)} .status.cancelled,.status.noshow{color:var(--red)}
.stars{display:flex;gap:4px;justify-content:center;margin:8px 0}
.stars button{border:0;background:none;font-size:30px;color:var(--line);padding:2px}
.stars button[aria-pressed="true"]{color:var(--accent-ink)}
.result{text-align:center;padding:18px 0 4px}
.result .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;font-size:30px}
.result .big.ok{background:var(--green-soft);color:var(--green)}
.result .big.warn{background:var(--mark-soft);color:var(--ink)}
.result .big.off{background:var(--red-soft);color:var(--red)}

/* ===== Escáner y QR ===== */
.viewfinder{position:relative;aspect-ratio:1/1;max-height:360px;margin:6px auto 0;border-radius:10px;overflow:hidden;background:#0B0B0C;display:grid;place-items:center;color:#cfd9e4;text-align:center}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .frame{position:absolute;inset:16%;border:3px solid var(--mark);border-radius:14px;box-shadow:0 0 0 999px rgba(5,12,20,.45)}
.viewfinder .msg{position:relative;padding:20px;font-size:14px;max-width:30ch}
.viewfinder .msg .ic{font-size:34px;display:block;margin:0 auto 8px;color:var(--mark)}
.qrcard{background:#fff;color:#0B0B0C;border:1px solid var(--line);border-radius:8px;padding:20px;text-align:center;margin-top:12px}
.qrcard canvas{width:min(100%,260px);height:auto;aspect-ratio:1/1;image-rendering:pixelated}
.qrcard .code{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.1em;margin-top:6px}
.qrcard h3{font-family:var(--serif);font-weight:600;font-size:18px;margin-bottom:8px}
.qrcard p{margin:6px 0 0;color:#2E343B;font-size:13.5px}

/* ===== Navegación, hojas, avisos ===== */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:10px 0 9px;min-height:56px}
nav.tabs button .ic{font-size:21px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ic{stroke-width:2.4}
nav.tabs .fab{align-self:start;justify-self:center;width:62px;height:62px;min-height:0;margin-top:-22px;padding:0;border-radius:50%;background:var(--mark);color:var(--on-mark);

/* ---------- disponibilidad simulada ---------- */
function taken(s, z, date, slot){
  const r = (hash(s.id + z.id + date + slot) % 1000) / 1000, h = slot / 60;
  const peak = (h >= 11 && h < 14) ? .95 : (h >= 15 && h < 20) ? .85 : .5;
  return Math.min(z.cap, Math.floor(z.cap * r * peak * 1.05));
}
function userUnits(s, z, date, a, b){
  return db.res.filter(r => r.sid === s.id && r.zid === z.id && r.date === date && (r.status === 'confirmed' || r.status === 'active') && r.start < b && r.start + r.dur > a)
    .reduce((n, r) => n + r.people, 0);
}
function zoneFree(s, z, date, start, dur){
  let m = z.cap;
  for (let t = Math.floor(start / 30) * 30; t < start + dur; t += 30) m = Math.min(m, z.cap - taken(s, z, date, t) - userUnits(s, z, date, t, t + 30));
  return Math.max(0, m);
}
function spaceNow(s, zf){
  const d = now(), m = minsOf(d), date = dkey(d);
  if (s.paused) return {state:'off', free:0, txt:'Pausado por el anfitrión'};
  if (m < s.open) return {state:'off', free:0, txt:'Abre a las ' + hm(s.open)};
  if (m >= s.close) return {state:'off', free:0, txt:'Cerrado'};
  let free = 0; s.zones.forEach(z => { if (!zf || zf(z)) free += zoneFree(s, z, date, m, 30); });
  if (free <= 0) return {state:'off', free:0, txt:'Sin cupo ahora'};
  return {state: free <= 3 ? 'low' : 'ok', free, txt: free + (free === 1 ? ' libre ahora' : ' libres ahora')};
}
function openTxt(s){
  const m = minsOf(now());
  if (s.paused) return 'Pausado por el anfitrión';
  if (m < s.open) return 'Cerrado, abre a las ' + hm(s.open);
  if (m >= s.close) return 'Cerrado, abre mañana a las ' + hm(s.open);
  return 'Abierto hasta las ' + hm(s.close);
}

function parseLocal(raw){
  let c = String(raw || '').trim();
  const m = c.match(/^PAUSA[:|]LOCAL[:|](.+)$/i); if (m) c = m[1];
  c = c.replace(/^PAUSA-/i, '').toLowerCase();
  return spaces().find(s => s.id.toLowerCase() === c) || null;
}
const localCode = s => 'PAUSA-' + s.id.toUpperCase();
function doScan(raw){
  const s = parseLocal(raw);
  if (!s) return {kind:'unknown'};
  const list = syncRes().filter(r => r.sid === s.id), t = now().getTime();
  const act = list.find(r => r.status === 'active');
  if (act){
    const all = db.res, r = all.find(x => x.id === act.id);
    r.status = 'done'; r.outAt = t; db.res = all;
    db.log = db.log.concat([{t, sid:s.id, rid:r.id, type:'out'}]);
    return {kind:'out', rid:r.id};
  }
  const cand = list.filter(r => r.status === 'confirmed').sort((a, b) => rStart(a) - rStart(b));
  const ok = cand.find(r => t >= rStart(r) - 15 * 60000 && t <= rEnd(r));
  if (ok){
    const all = db.res, r = all.find(x => x.id === ok.id);
    r.status = 'active'; r.inAt = t; db.res = all;
    db.log = db.log.concat([{t, sid:s.id, rid:r.id, type:'in'}]);
    return {kind:'in', rid:r.id};
  }
  const next = cand.find(r => rStart(r) > t);
  if (next) return {kind:'early', rid:next.id, sid:s.id};
  return {kind:'none', sid:s.id};
}

/* ---------- generador de QR (versiones 1 a 4, corrección L) ---------- */
const QR = (() => {
  const SPEC = [null, {dc:19, ec:7}, {dc:34, ec:10}, {dc:55, ec:15}, {dc:80, ec:20}];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  function rsGen(deg){
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++){ for (let j = 0; j < deg; j++){ r[j] = mul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = mul(root, 2); }
    return r;
  }
  function rsRem(data, gen){
    const r = new Array(gen.length).fill(0);
    data.forEach(b => { const f = b ^ r.shift(); r.push(0); gen.forEach((c, i) => { r[i] ^= mul(c, f); }); });
    return r;
  }
  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1; while (v <= 4 && bytes.length > SPEC[v].dc - 2) v++;
    if (v > 4) throw new Error('Texto demasiado largo para el QR');
    const {dc, ec} = SPEC[v], size = 17 + 4 * v;
    const bits = []; const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, dc * 8 - bits.length)); while (bits.length % 8) bits.push(0);
    for (let p = 0xEC; bits.length < dc * 8; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8){ let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    const all = data.concat(rsRem(data, rsGen(ec)));

    const mod = Array.from({length:size}, () => new Array(size).fill(false));
    const fn = Array.from({length:size}, () => new Array(size).fill(false));
    const setFn = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++){ setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
      const x = cx + dx, y = cy + dy; if (x < 0 || x >= size || y < 0 || y >= size) continue;
      const d = Math.max(Math.abs(dx), Math.abs(dy)); setFn(x, y, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    if (v >= 2){ const c = size - 7; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(c + dx, c + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }
    const fmt = mask => {
      const d = (1 << 3) | mask; let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bs = ((d << 10) | rem) ^ 0x5412, g = i => ((bs >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setFn(8, i, g(i));
      setFn(8, 7, g(6)); setFn(8, 8, g(7)); setFn(7, 8, g(8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, g(i));
      setFn(8, size - 8, true);
    };
    fmt(0);
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && k < all.length * 8){ mod[y][x] = ((all[k >>> 3] >>> (7 - (k & 7))) & 1) !== 0; k++; }
      }
    }
    const MASKS = [(x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0, (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0, (x,y)=>(x*y%2+x*y%3)%2===0, (x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0;
      const line = a => { let run = 1; for (let i = 1; i <= a.length; i++){ if (i < a.length && a[i] === a[i-1]) run++; else { if (run >= 5) p += 3 + run - 5; run = 1; } }
        const s = a.map(b => b ? '1' : '0').join(''); ['10111010000','00001011101'].forEach(pat => { let i = -1; while ((i = s.indexOf(pat, i + 1)) >= 0) p += 40; }); };
      for (let y = 0; y < size; y++) line(mod[y]);
      for (let x = 0; x < size; x++) line(mod.map(r => r[x]));
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++){ const c = mod[y][x]; if (c === mod[y][x+1] && c === mod[y+1][x] && c === mod[y+1][x+1]) p += 3; }
      let dark = 0; mod.forEach(r => r.forEach(c => { if (c) dark++; }));
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++){ applyMask(m); fmt(m); const p = penalty(); if (p < bestP){ bestP = p; best = m; } applyMask(m); }
    applyMask(best); fmt(best);
    return mod;
  }

    const m = encode(text), n = m.length, q = 4, S = (n + q * 2) * px;

    const c = canvas.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, S, S); c.fillStyle = '#000000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) c.fillRect((x + q) * px, (y + q) * px, px, px);
  }
  return {encode, draw};
})();

async function startCam(){
  const msg = $('#vmsg'), vid = $('#vid'), btn = $('#camBtn');
  const fail = t => { msg.hidden = false; msg.innerHTML = I('alert') + esc(t); btn.disabled = false; };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail('Este navegador no permite usar la cámara. Usa el código o el modo demostración.');
  if (!('BarcodeDetector' in window)) return fail('Este navegador no lee QR automáticamente. Usa el código impreso o prueba en Chrome para Android.');
  btn.disabled = true; msg.textContent = 'Abriendo cámara…';
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    vid.srcObject = camStream; vid.hidden = false; await vid.play(); msg.hidden = true; $('#frm').hidden = false; btn.hidden = true;
    const det = new BarcodeDetector({formats:['qr_code']});
    camTimer = setInterval(async () => {
      try{ const c = await det.detect(vid); if (c.length){ const raw = c[0].rawValue; stopCam(); finishScan(raw); } }catch(e){}
    }, 300);
  }catch(e){ fail(e && e.name === 'NotAllowedError' ? 'No diste permiso para usar la cámara. Actívalo en el navegador o usa el código.' : 'No se pudo abrir la cámara. Usa el código o el modo demostración.'); }
}
function finishScan(raw){
  const res = doScan(raw);
  go('scanres', res, {replace:true});
}

function finalRules(){
  const r = wz.rules.slice();
  if (String(wz.minc).trim() && +wz.minc > 0) r.push('Consumo mínimo de S/ ' + (+wz.minc) + ' por turno');
  if (wz.custom.trim()) r.push(wz.custom.trim());
  r.push('Máximo ' + durTxt(wz.maxDur) + ' por turno');

}
function wzValidate(){
  if (wz.step === 1){
    if (wz.name.trim().length < 3) return 'Escribe el nombre de tu espacio.';
    if (wz.addr.trim().length < 3) return 'Escribe la dirección o una referencia.';
    if (!wz.pos) return 'Toca el mapa para marcar la ubicación de tu espacio.';
    if (!(toMin(wz.open) < toMin(wz.close))) return 'La hora de cierre debe ser posterior a la de apertura.';
  }
  if (wz.step === 2){
    if (wz.zd) return 'Guarda o cancela la zona que estás editando.';
    if (!wz.zones.length) return 'Añade al menos una zona.';
  }
  if (wz.step === 4 && !wz.terms) return 'Acepta las condiciones para publicar.';
  return '';
}

    host:db.user.name || 'Tú', maxDur:wz.maxDur, about:wz.about.trim(), rules:finalRules(), paused:false, own:true,
    zones:wz.zones.map(z => ({...z, sid:id}))};

}

function setPath(path, val){
  const p = path.split('.');
  if (p[0] === 'user'){ const u = db.user; u.name = val; db.user = u; return; }
  const roots = {wz:() => wz, zd:() => wz && wz.zd, pay:() => payDraft, ui:() => ui};
  let o = roots[p[0]](); if (!o) return;
  for (let i = 1; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length - 1]] = path === 'wz.maxDur' ? +val : val;
  if (path === 'ui.sort') exPaint();
}
const pressWithin = (el, v) => { $$('[data-v]', el.parentElement).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); };
Object.assign(A, {
  tab:d => tab(d.to), back:() => back(), closesheet:() => closeSheet(),

  date:d => { bk.date = d.v; bk.start = null; redraw(); },

  res:d => go('res', {rid:d.id}),
  restab:d => { resTab = d.v; redraw(); },
  cancelres:async d => {

    if (!ok) return;

  },
  extend:d => {
